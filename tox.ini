[tox]

[testenv]
extras =
    testsite

commands =
    mypy --install-types --non-interactive src/climate_claw_client
    isort --check src/climate_claw_client -l 100
    black --line-length 100 --check src/climate_claw_client
    blackdoc --check src/climate_claw_client
    flake8 src/climate_claw_client
    pytest -v --cov --cov-branch --cov-fail-under=95

[pytest]
python_files = tests.py test_*.py *_tests.py
norecursedirs = .* build dist *.egg venv docs
